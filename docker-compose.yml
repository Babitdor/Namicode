services:
  # ── Ollama (LLM backend) ──────────────────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_KEEP_ALIVE=24h
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Documentation Update Agent ────────────────────────────────────────────
  doc-agent:
    build: .
    ports:
      - "2024:2024"
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - DOC_AGENT_MODEL=gemma4:31b-cloud
    volumes:
      - .:/app
      - /app/.venv  # preserve container venv
    depends_on:
      ollama:
        condition: service_healthy
    command: >
      sh -c "uv run langgraph dev --host 0.0.0.0 --port 2024"
    restart: unless-stopped

  # ── Code Review Agent ─────────────────────────────────────────────────────
  code-review-agent:
    build: .
    ports:
      - "2025:2024"
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - DOC_AGENT_MODEL=gemma4:31b-cloud
    volumes:
      - .:/app
      - /app/.venv
    depends_on:
      ollama:
        condition: service_healthy
    command: >
      sh -c "uv run langgraph dev --host 0.0.0.0 --port 2024"
    restart: unless-stopped

  # ── Test Generation Agent ─────────────────────────────────────────────────
  test-gen-agent:
    build: .
    ports:
      - "2026:2024"
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - DOC_AGENT_MODEL=gemma4:31b-cloud
    volumes:
      - .:/app
      - /app/.venv
    depends_on:
      ollama:
        condition: service_healthy
    command: >
      sh -c "uv run langgraph dev --host 0.0.0.0 --port 2024"
    restart: unless-stopped

  # ── Dependency Audit Agent ────────────────────────────────────────────────
  dep-audit-agent:
    build: .
    ports:
      - "2027:2024"
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - DOC_AGENT_MODEL=gemma4:31b-cloud
    volumes:
      - .:/app
      - /app/.venv
    depends_on:
      ollama:
        condition: service_healthy
    command: >
      sh -c "uv run langgraph dev --host 0.0.0.0 --port 2024"
    restart: unless-stopped

  # ── Refactoring Agent ─────────────────────────────────────────────────────
  refactor-agent:
    build: .
    ports:
      - "2028:2024"
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - DOC_AGENT_MODEL=gemma4:31b-cloud
    volumes:
      - .:/app
      - /app/.venv
    depends_on:
      ollama:
        condition: service_healthy
    command: >
      sh -c "uv run langgraph dev --host 0.0.0.0 --port 2024"
    restart: unless-stopped

volumes:
  ollama_data:
