[project]
name = "nova-shell-compact-plugin"
version = "0.1.0"
description = "Nova plugin: compacts long shell tool outputs before they reach the agent — reduces token waste."
requires-python = ">=3.11"
dependencies = [
    "langchain-core>=1.0",
    "langchain>=1.0",
]

[project.entry-points."nova.plugins"]
nova-shell-compact-plugin = "nova_shell_compact_plugin:register"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"