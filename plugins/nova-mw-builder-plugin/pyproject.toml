[project]
name = "nova-mw-builder-plugin"
version = "0.1.0"
description = "Nova plugin: a subagent that builds middleware plugins — scaffolds the full plugin structure from a natural-language description."
requires-python = ">=3.11"
dependencies = [
    "langchain-core>=1.0",
    "langchain>=1.0",
]

[project.entry-points."nova.plugins"]
nova-mw-builder-plugin = "nova_mw_builder_plugin:register"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"