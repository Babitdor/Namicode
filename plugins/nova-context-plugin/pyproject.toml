[project]
name = "nova-context-plugin"
version = "0.1.0"
description = "Nova plugin: dynamic context injection — middleware, context tool, /context command, and a context subagent."
requires-python = ">=3.11"
dependencies = [
    "langchain-core>=1.0",
    "langchain>=1.0",
]

[project.entry-points."nova.plugins"]
nova-context-plugin = "nova_context_plugin:register"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"