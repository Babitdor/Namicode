[project]
name = "nova-tool-summarizer"
version = "0.1.0"
description = "Compacts verbose tool outputs across all tools — bash, read_file, grep, glob, etc."
requires-python = ">=3.11"
dependencies = [
    "langchain-core>=1.0",
    "langchain>=1.0",
]

[project.entry-points."nova.plugins"]
nova-tool-summarizer = "nova_tool_summarizer:register"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"