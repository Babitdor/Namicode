[project]
name = "nova_hello_mw"
version = "0.1.0"
description = "A demo middleware that prints 'Hello, World!' before every model call."
requires-python = ">=3.11"
dependencies = [
    "langchain-core>=1.0",
    "langchain>=1.0",
]

[project.entry-points."nova.plugins"]
nova-hello-mw = "nova_hello_mw:register"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"
