[project]
name = "nova-audit-plugin"
version = "0.1.0"
description = "Nova plugin: tool audit trail — middleware, query tool, /audit command, and an auditor subagent."
requires-python = ">=3.11"
dependencies = [
    "langchain-core>=1.0",
    "langchain>=1.0",
]

[project.entry-points."nova.plugins"]
nova-audit-plugin = "nova_audit_plugin:register"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"