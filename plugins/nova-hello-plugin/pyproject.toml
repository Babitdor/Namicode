[project]
name = "nova-hello-plugin"
version = "0.1.0"
description = "Example Nova plugin: a tool, a /hello command, a middleware, and a subagent."
requires-python = ">=3.11"
# These are already provided by Nova's environment; listed for standalone builds.
dependencies = [
    "langchain-core>=1.0",
    "langchain>=1.0",
]

# This is what makes Nova discover the plugin. The entry-point name should match
# the name returned by register() so users enable it by the same name.
[project.entry-points."nova.plugins"]
nova-hello-plugin = "nova_hello_plugin:register"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"
